# Build wardtest and run the libcheck unit suite.  Mirrors the Fedora
# Dockerfile.client build recipe.  The NFS / lock-manager stress itself
# needs real mounts and is not run here.

stages:
  - test

build-and-test:
  stage: test
  image: fedora:43
  before_script:
    - dnf install -y autoconf automake gcc make pkg-config check-devel
  script:
    - mkdir -p m4
    - autoreconf -fi
    - mkdir -p build_ci && cd build_ci
    - ../configure
    - make -j"$(nproc)"
    - make check
  artifacts:
    when: always
    paths:
      - build_ci/tests/test_wardtest.log
    expire_in: 1 week
